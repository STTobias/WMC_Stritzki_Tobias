<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hausübung 18.03</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <h1 id="heading">DOM Manipulation</h1>

    <div class="section">
        <h2>Aufgabe 1 – Zähler mit onclick</h2>
        <span id="counter">0</span>
        <div class="buttons">
            <button onclick="add()">+</button>
            <button onclick="sub()">-</button>
            <button onclick="resetCounter()">RESET</button>
        </div>
    </div>

    <div class="section">
        <h2>Aufgabe 2 – Zufallsfarbe</h2>
        <p>Klick auf den Button um der Überschrift oben eine Zufallsfarbe zu geben</p>
        <button onclick="randomColor()">ZUFALL</button>
    </div>

    <div class="section">
        <h2>Aufgabe 3 – Zähler mit addEventListener</h2>
        <span id="counter2">0</span>
        <div class="buttons">
            <button id="btnPlus">+</button>
            <button id="btnMinus">-</button>
            <button id="btnReset">RESET</button>
        </div>
    </div>

</body>

</html>
